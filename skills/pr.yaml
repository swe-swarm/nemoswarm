name: pr
displayName: Pull Request Summary
description: Summarize changes for a pull request description
tools:
  - bash
  - view
  - grep
prompt: |
  Write a pull request description for the current branch's changes.

  Steps:
  1. Run `git log main..HEAD --oneline` (or `git log origin/main..HEAD --oneline`) to see commits
  2. Run `git diff main...HEAD` to see the full diff
  3. Read key changed files for context

  Output a PR description with:
  ## Summary
  What this PR does (2-4 bullet points, focus on *what* changed and *why*)

  ## Changes
  Key files/modules modified and what changed in each

  ## Testing
  How to test or verify this works

  Keep it factual. No hype. No filler sentences.
  {{args}}
