name: commit
displayName: Generate Commit Message
description: Analyze staged changes and write a conventional commit message
tools:
  - bash
  - view
  - grep
prompt: |
  Analyze the current git staged changes and write a conventional commit message.

  Steps:
  1. Run `git diff --cached` to see staged changes
  2. Run `git status` to see the full picture
  3. Write a commit message following Conventional Commits:
     <type>(<scope>): <short description>

     [optional body]

  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore
  - Title: imperative mood, ≤72 chars, no period
  - Body: explain *why*, not what (wrap at 72 chars)
  - If trivial, title only is fine

  Output ONLY the commit message, nothing else.
  {{args}}
